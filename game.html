*{box-sizing:border-box;margin:0}body{background:#fff;font-family:"Futura PT",sans-serif;display:flex;justify-content:center;padding:24px 12px}
.ph{width:340px;height:700px;border-radius:44px;overflow:hidden;position:relative;background:#1433A2;box-shadow:0 0 0 10px #111,0 20px 40px rgba(0,0,0,.18);user-select:none;touch-action:none}
.hud{position:absolute;left:24px;right:24px;top:40px;color:#D9F813;z-index:3;pointer-events:none}
.top{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.meter{display:flex;gap:6px;margin-top:8px}.meter i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);transition:.25s}.meter i.on{background:#D9F813;box-shadow:inset -4px -4px 0 rgba(0,0,0,.15);transform:scale(1.08)}
.sub{font-size:14px;font-weight:500;margin-top:6px}
.hint{position:absolute;left:0;right:0;bottom:190px;text-align:center;color:#fff;font-size:16px;font-weight:500;opacity:.85;z-index:3;pointer-events:none;transition:opacity .6s}
canvas{position:absolute;inset:0;width:100%;height:100%}
.win{position:absolute;inset:0;background:#067B35;color:#F4729E;padding:60px 24px 30px;display:flex;flex-direction:column;z-index:5;opacity:0;pointer-events:none;transition:.4s}
.win.show{opacity:1;pointer-events:auto}
.win .t{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;font-weight:500}
.win h1{font-size:48px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;line-height:1;margin-top:12px}
.win p{color:#fff;font-size:16px;margin-top:12px;line-height:1.35}
.code{font-size:42px;font-weight:800;letter-spacing:.08em;background:#fff;color:#1433A2;border-radius:16px;padding:16px;margin-top:16px}
.win button{margin-top:auto;border:0;border-radius:16px;padding:16px;font:800 19px "Futura PT";background:#F4729E;color:#0A3D1E;text-align:left;cursor:pointer}
</style></head><body><div class="ph" id="ph">
<a href="/" style="position:absolute;z-index:4;right:24px;top:12px;color:#D9F813">← Back</a><div class="hud"><div class="top">Shoot a barev</div><div class="meter" id="m"><i></i><i></i><i></i><i></i><i></i></div><div class="sub" id="sub">0 of 5 · 5 = a paper postcard, free</div></div>
<div class="hint" id="hint">Flick a ball up into the hoop</div>
<canvas id="c"></canvas>
<div class="win" id="win"><div class="t">Reward unlocked</div><h1>Barev,<br>janik!</h1><p>You collected 5 barevs. A paper postcard is yours, free.</p><p>Get your QR in Telegram and show it at the shop.</p><a id="claim" style="display:block;background:#F4729E;color:#0A3D1E;border-radius:16px;padding:16px;margin-top:20px;text-decoration:none">Claim in Telegram →</a><button id="more">Keep playing →</button></div>
</div>
<script>
{
const ph=document.getElementById("ph"),c=document.getElementById("c"),x=c.getContext("2d");
const LIME="#D9F813",BLUE="#1433A2",PINK="#F4729E";
let W,H,dpr;const size=()=>{const r=ph.getBoundingClientRect();dpr=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};size();
let ac;const tone=(f,t,d,v,ty)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty||"sine";o.frequency.value=f;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d+.05)}catch(e){}};
let lp=0;const pok=v=>{const n=performance.now();if(n-lp<70)return;lp=n;tone(150+Math.random()*50,0,.08,Math.min(.16,v/4000),"triangle")};
function sprite(r,label){const s=Math.ceil(r*2*dpr),cv=document.createElement("canvas");cv.width=cv.height=s;const g=cv.getContext("2d");g.scale(dpr,dpr);g.translate(r,r);g.save();g.beginPath();g.arc(0,0,r,0,7);g.clip();g.fillStyle=LIME;g.fillRect(-r,-r,2*r,2*r);
for(let i=0;i<r*14;i++){g.fillStyle=Math.random()<.5?"rgba(255,255,255,.18)":"rgba(0,0,0,.1)";const a=Math.random()*6.28,d=Math.sqrt(Math.random())*r;g.fillRect(Math.cos(a)*d,Math.sin(a)*d,1.4,.6)}
const sx=label?-r*.42:0;g.strokeStyle=BLUE;g.lineWidth=r*.1;g.lineCap="round";g.beginPath();g.moveTo(sx-r*.45,-r*1.05);g.bezierCurveTo(sx+r*.55,-r*.35,sx-r*.55,r*.35,sx+r*.45,r*1.05);g.stroke();
if(label){g.fillStyle=BLUE;g.font=`800 ${r*.25}px "Futura PT"`;g.fillText("BAREV,",-r*.08,-r*.03);g.fillText("JANIK",-r*.08,r*.26)}
const gr=g.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.05);gr.addColorStop(0,"rgba(255,255,255,.35)");gr.addColorStop(.55,"rgba(255,255,255,0)");gr.addColorStop(1,"rgba(0,0,0,.3)");g.fillStyle=gr;g.fillRect(-r,-r,2*r,2*r);g.restore();return cv}
const balls=[];
document.fonts.ready.then(()=>{for(let i=0;i<7;i++){const gold=i===3,r=gold?30:26;balls.push({x:40+i*40,y:-60-i*50,vx:(Math.random()-.5)*200,vy:0,a:0,r,gold,sp:sprite(r,gold),armed:false})}});
const hoop={y:245,half:36,x:170,t:0},rimR=5;let net=0,score=0,won=false;const pops=[];
const meter=[...document.querySelectorAll("#m i")],sub=document.getElementById("sub");
let rewardState, sending=false;
const pendingHits=[];
async function rewardRequest(path,body){
 const response=await fetch("/game/"+path,{
  method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
 });
 if(!response.ok)throw new Error("Could not connect");
 return response.json();
}
function showReward(){
 const hits=rewardState.score;
 meter.forEach((m,i)=>m.classList.toggle("on",i<hits));
 sub.textContent=hits<5?`${hits} of 5 · 5 = a paper postcard, free`:"5 of 5 · reward unlocked";
 if(rewardState.claim&&!won){
  won=true;
  document.getElementById("claim").href=rewardState.claim;
  setTimeout(()=>document.getElementById("win").classList.add("show"),700);
 }
}
async function recordHits(){
 if(sending)return;
 sending=true;
 try{
  if(!rewardState){rewardState=await rewardRequest("session",{});showReward()}
  while(pendingHits.length&&!rewardState.claim){
   const hit=pendingHits[0];
   rewardState=await rewardRequest("hit",{turn:rewardState.turn,...hit});
   pendingHits.shift();
   showReward();
  }
  if(rewardState.claim)pendingHits.length=0;
 }catch{
  sub.textContent="Reconnecting to save your score…";
  setTimeout(recordHits,2000);
 }finally{sending=false}
}
recordHits();
function addScore(n,bx,by,crossing){score+=n;pops.push({x:bx,y:by,t:1,s:"+"+n});net=1;tone(660,0,.25,.2);tone(990,.1,.35,.2);
if(!won){pendingHits.push(crossing);recordHits()}}
document.getElementById("more").onclick=()=>document.getElementById("win").classList.remove("show");
let grab=null,last=null;const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
ph.addEventListener("pointerdown",e=>{const[px,py]=pt(e);const b=balls.find(b=>Math.hypot(b.x-px,b.y-py)<b.r+10);if(b){grab=b;b.vx=b.vy=0;last=[px,py,performance.now()];ph.setPointerCapture(e.pointerId);document.getElementById("hint").style.opacity=0}});
ph.addEventListener("pointermove",e=>{if(!grab)return;const[px,py]=pt(e),n=performance.now(),d=Math.max(8,n-last[2])/1000;grab.vx=(px-last[0])/d;grab.vy=(py-last[1])/d;grab.x=px;grab.y=Math.max(grab.r,py);last=[px,py,n]});
const up=()=>{if(grab){grab.vx=Math.max(-1800,Math.min(1800,grab.vx));grab.vy=Math.max(-2300,Math.min(2300,grab.vy));grab.armed=grab.y>hoop.y+40;grab=null}};ph.addEventListener("pointerup",up);ph.addEventListener("pointercancel",up);
function step(dt){const G=1900,e=.55;hoop.t+=dt;hoop.x=W/2+Math.sin(hoop.t*.7)*(W/2-80);
const rims=[[hoop.x-hoop.half,hoop.y],[hoop.x+hoop.half,hoop.y]];
for(const b of balls){if(b===grab)continue;const py=b.y;b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*e}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*e}
if(b.y<b.r&&b.vy<0&&py>-50){b.y=b.r;b.vy=Math.abs(b.vy)*e}
if(b.y>H-b.r){b.y=H-b.r;if(b.vy>260)pok(b.vy);b.vy=-b.vy*e;if(Math.abs(b.vy)<40)b.vy=0;b.vx*=.985}
for(const[rx,ry]of rims){const dx=b.x-rx,dy=b.y-ry,d=Math.hypot(dx,dy),m=b.r+rimR;if(d&&d<m){const nx=dx/d,ny=dy/d;b.x=rx+nx*m;b.y=ry+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.6*vn*nx;b.vy-=1.6*vn*ny;pok(300)}}}
if(b.armed&&py<hoop.y&&b.y>=hoop.y&&b.vy>0&&Math.abs(b.x-hoop.x)<hoop.half-rimR){b.armed=false;addScore(b.gold?2:1,b.x,hoop.y,{x:b.x,previousY:py,y:b.y,vy:b.vy,hoopX:hoop.x})}
if(b.y>hoop.y+60&&b.vy>=0&&!b.armed&&b.y>H*.6)b.armed=true;
b.a+=b.vx*dt/b.r}
for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const p=balls[i],q=balls[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),m=p.r+q.r;if(!d||d>=m)continue;const nx=dx/d,ny=dy/d,o=(m-d)/2;if(p!==grab){p.x-=nx*o;p.y-=ny*o}if(q!==grab){q.x+=nx*o;q.y+=ny*o}const rv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;if(rv<0){const k=-(1+e)*rv/2;p.vx-=k*nx;p.vy-=k*ny;q.vx+=k*nx;q.vy+=k*ny}}
net=Math.max(0,net-dt*2);for(const p of pops){p.t-=dt;p.y-=40*dt}while(pops.length&&pops[0].t<=0)pops.shift()}
function drawBack(){const hx=hoop.x,hy=hoop.y;x.fillStyle="rgba(255,255,255,.92)";x.beginPath();x.roundRect(hx-58,hy-78,116,74,6);x.fill();x.strokeStyle=PINK;x.lineWidth=4;x.strokeRect(hx-24,hy-56,48,34);
x.strokeStyle="rgba(255,255,255,.85)";x.lineWidth=2;const w=Math.sin(performance.now()/40)*6*net;for(let i=0;i<=6;i++){const t=i/6,x0=hx-hoop.half+t*hoop.half*2,x1=hx-hoop.half*.7+t*hoop.half*1.4+w;x.beginPath();x.moveTo(x0,hy+2);x.lineTo(x1,hy+46+net*10);x.stroke()}
x.beginPath();x.moveTo(hx-hoop.half*.85+w*.5,hy+24);x.lineTo(hx+hoop.half*.85+w*.5,hy+24);x.stroke();x.strokeStyle=PINK;x.lineWidth=6;x.beginPath();x.ellipse(hx,hy,hoop.half,8,0,Math.PI,2*Math.PI);x.stroke()}
function drawFront(){x.strokeStyle=PINK;x.lineWidth=6;x.beginPath();x.ellipse(hoop.x,hoop.y,hoop.half,8,0,0,Math.PI);x.stroke()}
let t0=performance.now();function loop(t){const dt=Math.min(1/30,(t-t0)/1000);t0=t;step(dt/2);step(dt/2);x.clearRect(0,0,W,H);drawBack();
for(const b of balls){x.save();x.translate(b.x,b.y);x.rotate(b.a);x.drawImage(b.sp,-b.r,-b.r,b.r*2,b.r*2);x.restore()}
drawFront();x.font='800 26px "Futura PT"';x.fillStyle=LIME;for(const p of pops){x.globalAlpha=Math.max(0,p.t);x.fillText(p.s,p.x+20,p.y);x.globalAlpha=1}requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener("resize",size);window.__g={balls,hoop,get score(){return score}};
}
</script></body></html>
