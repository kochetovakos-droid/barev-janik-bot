  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #fff; font-family: "Futura PT", sans-serif; padding: 32px 16px; }
  .row { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 14px; color: #555; }

  .phone { width: 340px; height: 700px; border-radius: 44px; overflow: hidden; position: relative; background: var(--bg);
           box-shadow: 0 0 0 10px #111, 0 20px 40px rgba(0,0,0,.18); user-select: none; }
  .t-blue  { --bg:#1433A2; --title:#D9F813; --ink:#D9F813; --card:#D9F813; --cardInk:#1433A2; --no:#F4729E; --noInk:#1433A2; }
  .t-lilac { --bg:#BB84EF; --title:#D9F813; --ink:#1433A2; --card:#D9F813; --cardInk:#1433A2; --no:#1433A2; --noInk:#D9F813; }
  .t-green { --bg:#067B35; --title:#F4729E; --ink:#FFFFFF; --card:#F4729E; --cardInk:#0A3D1E; --no:#D9F813; --noInk:#0A3D1E; }

  .screen { position: absolute; inset: 0; padding: 50px 24px 30px; display: flex; flex-direction: column; text-align: left;
            transition: opacity .45s, transform .45s; }
  .hidden { opacity: 0; transform: translateY(24px); pointer-events: none; }
  .top { font-size: 14px; font-weight: 500; color: var(--ink); letter-spacing: .06em; text-transform: uppercase; }
  .title { font-weight: 800; color: var(--title); text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
  .ring .title { font-size: 62px; margin-top: 20px; }
  .sub { font-size: 20px; font-weight: 500; color: var(--ink); margin-top: 10px; }

  /* ring */
  .handset { margin: auto 0; align-self: center; position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
  .handset svg { width: 64px; height: 64px; fill: var(--title); position: relative; z-index: 2; animation: wiggle 1.2s infinite; }
  .handset.fast svg { animation-duration: .35s; }
  .pulse { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--title); opacity: 0; animation: pulse 2.4s infinite; }
  .pulse:nth-child(2) { animation-delay: .8s; } .pulse:nth-child(3) { animation-delay: 1.6s; }
  @keyframes pulse { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.15); opacity: 0; } }
  @keyframes wiggle { 0%,60%,100% { transform: rotate(0); } 10%,30%,50% { transform: rotate(-14deg); } 20%,40% { transform: rotate(14deg); } }
  .actions { display: flex; justify-content: space-between; }
  .btn { border: 0; cursor: pointer; font-family: inherit; font-weight: 500; font-size: 15px; display: flex; flex-direction: column;
         align-items: center; gap: 8px; background: none; color: var(--ink); }
  .btn i { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; }
  .btn i svg { width: 32px; height: 32px; }
  .decline i { background: var(--no); } .decline svg { fill: var(--noInk); transform: rotate(135deg); }
  .accept i { background: var(--card); animation: bounce 1.2s infinite; } .accept svg { fill: var(--cardInk); }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .toast { position: absolute; left: 24px; right: 24px; bottom: 140px; background: var(--card); color: var(--cardInk); z-index: 5;
           font-weight: 500; font-size: 16px; padding: 14px 16px; border-radius: 14px; opacity: 0; transform: translateY(10px); transition: .3s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }

  /* talk */
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .hang { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--no); display: grid; place-items: center; cursor: pointer; }
  .hang svg { width: 22px; height: 22px; fill: var(--noInk); transform: rotate(135deg); }
  .talk .title { font-size: 52px; margin-top: 14px; min-height: 104px; }
  .trans { font-size: 16px; color: var(--ink); margin-top: 4px; font-weight: 400; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .chip { display: block; text-decoration: none; background: var(--card); color: var(--cardInk); border-radius: 14px; padding: 10px 12px;
          border: 0; font-family: inherit; text-align: left; cursor: pointer; opacity: 0; transform: translateY(12px); transition: .4s; }
  .chip.in { opacity: 1; transform: none; }
  .chip b { display: block; font-size: 16px; font-weight: 700; }
  .chip span { display: block; font-size: 13px; font-weight: 400; line-height: 1.2; margin-top: 2px; }
  .chip.todo span { opacity: .65; }
  .send { margin-top: 10px; width: 100%; border: 2px solid var(--title); background: transparent; color: var(--title); border-radius: 16px;
          padding: 12px 14px; font-family: inherit; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
          opacity: 0; transform: translateY(12px); transition: .4s; }
  .send.in { opacity: 1; transform: none; }
  .send b { font-size: 20px; font-weight: 700; display: block; }
  .send span { font-size: 14px; font-weight: 400; display: block; color: var(--ink); }
  .send em { font-style: normal; font-size: 26px; }
  canvas.balls { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  /* postcards */
  .pick { background: var(--bg); z-index: 6; padding-left: 0; padding-right: 0; }
  .pick .bar, .pick .foot { padding: 0 24px; }
  .back { background: none; border: 0; color: var(--ink); font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; }
  .pick h2 { font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; color: var(--title); padding: 14px 24px 0; }
  .cards { display: flex; align-items: center; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 22px 45px; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .cards img { width: 230px; max-height: 470px; object-fit: contain; height: auto; flex: none; scroll-snap-align: center; border-radius: 4px; box-shadow: 0 10px 24px rgba(0,0,0,.28);
               transition: transform .3s; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 24px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: .35; transition: .2s; }
  .dots i.on { opacity: 1; }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .go { background: var(--card); color: var(--cardInk); border: 0; border-radius: 16px; padding: 16px; font-family: inherit; font-size: 20px;
        font-weight: 700; text-align: left; cursor: pointer; }
  .paper { font-size: 13px; color: var(--ink); font-weight: 400; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; overflow-x: hidden; padding: 14px 24px 18px; flex: 1; min-height: 0; align-content: start; scroll-snap-type: none; }
  .cards img { width: 100%; max-height: none; border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.22); outline: 3px solid transparent; outline-offset: 3px; transition: outline-color .15s, transform .15s; cursor: pointer; transform: none; }
  .cards img.sel { outline-color: var(--title); transform: scale(.97); }
  .dots { display: none; }
  .pick h2 { padding-bottom: 4px; }

.fld{width:100%;border:0;border-radius:12px;padding:12px 14px;font:400 16px "Futura PT",sans-serif;color:#1433A2;background:#fff;margin-top:8px;outline:none}

</style>

      <div class="title said"></div>

        <a class="chip" target="_blank" href="https://instagram.com/barev.janik"><b>Instagram</b><span>@barev.janik</span></a>

</div>

        <textarea class="msg" rows="2" maxlength="140" placeholder="Add a message (optional)"></textarea>

</template>

<script>
const setH = () => document.documentElement.style.setProperty("--h", innerHeight + "px"); setH(); addEventListener("resize", setH);
async function withMsg(src, txt) {
  const img = new Image(); img.src = src; await img.decode();
  const W = img.naturalWidth, IH = Math.round(W * 894 / 720), S = img.naturalHeight - IH, pad = 40, fs = 46, lh = 58;
  const c = document.createElement("canvas"), x = c.getContext("2d"); x.font = `500 ${fs}px "Futura PT"`;
  const lines = []; let cur = "";
  for (const para of txt.split("\n")) { cur = ""; for (const w of para.split(/\s+/)) { const t = cur ? cur + " " + w : w; if (x.measureText(t).width > W - pad * 2 && cur) { lines.push(cur); cur = w; } else cur = t; } lines.push(cur); }
  const band = pad * 2 + lines.length * lh - 12;
  c.width = W; c.height = img.naturalHeight + band;
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, 0, 0, W, IH, 0, 0, W, IH); x.drawImage(img, 0, IH, W, S, 0, IH + band, W, S);
  x.font = `500 ${fs}px "Futura PT"`; x.fillStyle = "#1433A2"; x.textBaseline = "top";
  lines.forEach((l, i) => x.fillText(l, pad, IH + pad + i * lh));
  return await new Promise(r => c.toBlob(r, "image/jpeg", .85));
}
const THEMES = [["t-blue","Blue + lime","plain_blue"],["t-lilac","Lilac + lime","plain_lilac"],["t-green","Green + pink","plain_green"]];
const PHONE = "+37477881576";
const css = (el, v) => getComputedStyle(el).getPropertyValue(v).trim();
let actx;
function audio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} return actx; }
function tone(f, t, dur, vol, type) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type || "sine"; o.frequency.value = f;
  o.connect(g); g.connect(a.destination); const s = a.currentTime + t;
  g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(vol, s + .01); g.gain.exponentialRampToValueAtTime(.001, s + dur);
  o.start(s); o.stop(s + dur + .05);
}
const chime = () => { tone(659, 0, .5, .22); tone(880, .18, .6, .22); };
let lastPok = 0;
const pok = v => { const n = performance.now(); if (n - lastPok < 70) return; lastPok = n; tone(140 + Math.random()*60, 0, .09, Math.min(.18, v/4000), "triangle"); };

function vcard() {
  const v = ["BEGIN:VCARD","VERSION:3.0","FN:BAREV, JANIK","ORG:BAREV, JANIK", PHONE ? "TEL;TYPE=CELL:" + PHONE : "",
    "ADR;TYPE=WORK:;;8 Pap Tagavor St (courtyard entrance);Yerevan;;;Armenia",
    "URL:https://instagram.com/barev.janik","NOTE:Open 12:00-20:00. Delivery across Yerevan.","END:VCARD"].filter(Boolean).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([v], {type: "text/vcard"})); a.download = "barev-janik.vcf"; a.click();
}

// tilt
let tiltX = 0;
function askTilt() {
  const on = () => addEventListener("deviceorientation", e => { if (e.gamma != null) tiltX = Math.max(-1, Math.min(1, e.gamma / 40)); });
  if (!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function")) on();
}

function makeSprite(r, base, ink, label, dpr) {
  const s = Math.ceil(r * 2 * dpr), c = document.createElement("canvas"); c.width = c.height = s;
  const x = c.getContext("2d"); x.scale(dpr, dpr); x.translate(r, r);
  x.save(); x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.clip();
  x.fillStyle = base; x.fillRect(-r, -r, 2 * r, 2 * r);
  for (let i = 0; i < r * 14; i++) {           // felt fuzz
    x.fillStyle = Math.random() < .5 ? "rgba(255,255,255,.18)" : "rgba(0,0,0,.10)";
    const a = Math.random() * 6.283, d = Math.sqrt(Math.random()) * r;
    x.fillRect(Math.cos(a) * d, Math.sin(a) * d, 1 + Math.random() * 1.4, .6);
  }
  x.strokeStyle = ink; x.lineWidth = r * .1; x.lineCap = "round";   // seam
  const sx = label ? -r * .42 : 0; x.beginPath(); x.moveTo(sx - r * .45, -r * 1.05); x.bezierCurveTo(sx + r * .55, -r * .35, sx - r * .55, r * .35, sx + r * .45, r * 1.05); x.stroke();
  if (label) {
    x.fillStyle = ink; x.font = `800 ${r * .25}px "Futura PT"`; x.textBaseline = "alphabetic";
    x.fillText("BAREV,", -r * .08, -r * .03); x.fillText("JANIK", -r * .08, r * .26);
  }
  const g = x.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.05);
  g.addColorStop(0, "rgba(255,255,255,.35)"); g.addColorStop(.55, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(0,0,0,.30)");
  x.fillStyle = g; x.fillRect(-r, -r, 2 * r, 2 * r); x.restore();
  return c;
}

class Pit {
  constructor(screen, canvas, theme) {
    this.s = screen; this.c = canvas; this.x = canvas.getContext("2d"); this.balls = []; this.run = false; this.grab = null;
    this.base = css(theme, "--card"); this.ink = css(theme, "--cardInk");
    screen.addEventListener("pointerdown", e => this.down(e)); addEventListener("resize", () => { if (this.run) this.size(); });
    screen.addEventListener("pointermove", e => this.move(e));
    screen.addEventListener("pointerup", e => this.up(e)); screen.addEventListener("pointercancel", e => this.up(e));
  }
  size() { const r = this.c.getBoundingClientRect(), d = devicePixelRatio || 1; this.W = r.width; this.H = r.height; this.dpr = d;
    this.c.width = r.width * d; this.c.height = r.height * d; this.x.setTransform(d, 0, 0, d, 0, 0); }
  drop(n) {
    this.size();
    for (let i = 0; i < n; i++) setTimeout(() => {
      const big = i % 3 === 0, r = big ? 34 : 24;
      this.balls.push({ x: 40 + Math.random() * (this.W - 80), y: -r - 10, vx: (Math.random() - .5) * 400, vy: Math.random() * 200, a: Math.random() * 6, r,
                        sp: makeSprite(r, this.base, this.ink, big, this.dpr) });
    }, i * 140);
    if (!this.run) { this.run = true; this.t = performance.now(); requestAnimationFrame(t => this.loop(t)); }
  }
  clear() { this.balls = []; this.run = false; this.x.clearRect(0, 0, this.W, this.H); }
  jump() { this.balls.forEach(b => { b.vy = -700 - Math.random() * 500; b.vx += (Math.random() - .5) * 500; }); }
  loop(t) {
    if (!this.run) return;
    const dt = Math.min(1 / 30, (t - this.t) / 1000); this.t = t;
    for (let k = 0; k < 2; k++) this.step(dt / 2);
    const x = this.x; x.clearRect(0, 0, this.W, this.H);
    for (const b of this.balls) { x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.drawImage(b.sp, -b.r, -b.r, b.r * 2, b.r * 2); x.restore(); }
    requestAnimationFrame(t => this.loop(t));
  }
  step(dt) {
    const G = 1900, e = .55, W = this.W, H = this.H, B = this.balls;
    for (const b of B) {
      if (b === this.grab) continue;
      b.vy += G * dt; b.vx += tiltX * 1600 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * e; }
      if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * e; }
      if (b.y > H - b.r) { b.y = H - b.r; if (b.vy > 260) pok(b.vy); b.vy = -b.vy * e; if (Math.abs(b.vy) < 40) b.vy = 0; b.vx *= .985; }
      b.a += b.vx * dt / b.r;
    }
    for (let i = 0; i < B.length; i++) for (let j = i + 1; j < B.length; j++) {
      const p = B[i], q = B[j], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy), m = p.r + q.r;
      if (!d || d >= m) continue;
      const nx = dx / d, ny = dy / d, o = (m - d) / 2;
      if (p !== this.grab) { p.x -= nx * o; p.y -= ny * o; } if (q !== this.grab) { q.x += nx * o; q.y += ny * o; }
      const rv = (q.vx - p.vx) * nx + (q.vy - p.vy) * ny;
      if (rv < 0) { const j2 = -(1 + e) * rv / 2; p.vx -= j2 * nx; p.vy -= j2 * ny; q.vx += j2 * nx; q.vy += j2 * ny; }
    }
  }
  pt(e) { const r = this.c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  down(e) {
    if (!this.run) return; const [px, py] = this.pt(e);
    const b = this.balls.find(b => Math.hypot(b.x - px, b.y - py) < b.r + 6);
    if (b) { this.grab = b; b.vx = b.vy = 0; this.last = [px, py, performance.now()]; this.s.setPointerCapture(e.pointerId); e.preventDefault(); this.grabbed = true; return; }
    this.grabbed = false;
    if (py > this.H - 120 && !e.target.closest("a,button")) this.jump();
  }
  move(e) {
    if (!this.grab) return; const [px, py] = this.pt(e), n = performance.now(), [lx, ly, lt] = this.last, d = Math.max(8, n - lt) / 1000;
    this.grab.vx = (px - lx) / d; this.grab.vy = (py - ly) / d; this.grab.x = px; this.grab.y = py; this.last = [px, py, n];
  }
  up() { if (this.grab) { this.grab.vx = Math.max(-2500, Math.min(2500, this.grab.vx)); this.grab.vy = Math.max(-2500, Math.min(2500, this.grab.vy)); } this.grab = null; }
}

const row = document.getElementById("row"), tpl = document.getElementById("tpl");
Promise.all([document.fonts.load('800 20px "Futura PT"').catch(() => {}), fetch("/api/cards").then(r => r.json())]).then(([_, info]) => [THEMES[Math.floor(Math.random() * 3)]].forEach(([cls, name, own]) => {
  const col = document.createElement("div"); col.className = "col"; col.innerHTML = ""; document.body.classList.add(cls);
  const ph = tpl.content.firstElementChild.cloneNode(true); ph.classList.add(cls); col.appendChild(ph); row.appendChild(col);
  const $ = s => ph.querySelector(s);
  $(".cards").innerHTML = info.cards.map(c => '<img data-k="' + c + '" src="/cards/' + c + '.jpg?v=' + info.v + '" alt="BAREV, JANIK postcard">').join("");
  const ring = $(".ring"), talk = $(".talk"), pick = $(".pick"), hs = $(".handset"), said = $(".said"), timer = $(".timer"),
        chips = ph.querySelectorAll(".chip, .send"), pit = new Pit(talk, $(".balls"), ph);
  const toast = (scr, msg) => { const t = scr.querySelector(".toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); };
  let tick, declines = 0;
  const DECL = ["You can't decline a barev, janik.", "Still no? We'll keep calling.", "OK, the balls will answer for you."];
  $(".decline").onclick = () => {
    toast(ring, DECL[Math.min(declines, 2)]); hs.classList.add("fast"); setTimeout(() => hs.classList.remove("fast"), 2200);
    if (++declines >= 3) setTimeout(() => $(".accept").click(), 1200);
  };
  $(".accept").onclick = () => {
    askTilt(); chime(); ring.classList.add("hidden"); talk.classList.remove("hidden");
    let sec = 0; timer.textContent = "00:00"; clearInterval(tick);
    tick = setInterval(() => { sec++; timer.textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0"); }, 1000);
    const text = "Barev,\nJanik!"; said.textContent = ""; let i = 0;
    const type = setInterval(() => {
      said.innerHTML = text.slice(0, ++i).replace("\n", "<br>");
      if (i >= text.length) { clearInterval(type); chips.forEach((c, k) => setTimeout(() => c.classList.add("in"), 120 * k)); setTimeout(() => pit.drop(9), 700); }
    }, 85);
  };
  $(".hang").onclick = () => {
    clearInterval(tick); pit.clear(); declines = 0; chips.forEach(c => c.classList.remove("in"));
    talk.classList.add("hidden"); ring.classList.remove("hidden");
  };
  $(".vcf").onclick = vcard;

  // postcards
  const strip = $(".cards"), imgs = [...strip.querySelectorAll("img")], dots = [...ph.querySelectorAll(".dots i")];
  let cur = 0;
  const mark = () => imgs.forEach((im, k) => im.classList.toggle("sel", k === cur));
  imgs.forEach((im, k) => im.onclick = () => { cur = k; mark(); });
  $(".send").onclick = () => { pick.classList.remove("hidden"); strip.scrollTop = 0; mark(); };
  $(".back").onclick = () => pick.classList.add("hidden");
  $(".go").onclick = async () => {
    const im = imgs[cur], txt = $(".msg").value.trim(), blob = txt ? await withMsg(im.src, txt) : await (await fetch(im.src)).blob(), file = new File([blob], "barev-janik.jpg", { type: "image/jpeg" });
    let sent = false;
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); sent = true; } } catch (e) { if (e.name === "AbortError") return; }
    if (!sent) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "barev-janik.jpg"; a.click(); }
    $(".msg").value = ""; pick.classList.add("hidden"); toast(talk, "Barev delivered."); tone(880, 0, .4, .2); tone(1175, .12, .5, .2); pit.jump();
  };

  // shop
  const shop = $(".shopscr"), prod = $(".prod"), prods = $(".prods"), pbody = $(".pbody");
  let items = [], sel = {};
  const fmt = n => n.toLocaleString("ru-RU") + " AMD";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  $(".shop").onclick = async () => {
    shop.classList.remove("hidden");
    try { items = await fetch("/api/products").then(r => r.json()); } catch (e) { items = []; }
    prods.innerHTML = items.length ? items.map((p, i) => `<button class="item" data-i="${i}"><img src="/products/${p.id}.jpg" alt=""><b>${esc(p.name)}</b><span>${fmt(p.price)}</span></button>`).join("")
                                   : '<div class="empty">The collection is coming here soon.</div>';
    prods.querySelectorAll(".item").forEach(b => b.onclick = () => openP(items[+b.dataset.i]));
  };
  const opts = (k, arr) => arr.length ? `<div class="lbl">${k === "size" ? "Size" : "Color"}</div>` + arr.map(v => `<button class="opt" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join("") : "";
  function openP(p) {
    sel = { id: p.id, size: "", color: "" };
    pbody.innerHTML = `<img src="/products/${p.id}.jpg" alt=""><h3>${esc(p.name)}</h3><div class="price">${fmt(p.price)}</div>${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}`
      + opts("color", p.colors) + opts("size", p.sizes)
      + `<div class="lbl">Your contact</div><input class="fld oname" placeholder="Name" maxlength="60"><input class="fld ophone" type="tel" placeholder="Phone or WhatsApp" maxlength="30"><input class="fld onote" placeholder="Comment (optional)" maxlength="300">`;
    pbody.querySelectorAll(".opt").forEach(b => b.onclick = () => { pbody.querySelectorAll(`.opt[data-k="${b.dataset.k}"]`).forEach(x => x.classList.remove("on")); b.classList.add("on"); sel[b.dataset.k] = b.dataset.v; });
    pbody.scrollTop = 0; prod.classList.remove("hidden"); prod.dataset.need = (p.sizes.length ? "s" : "") + (p.colors.length ? "c" : "");
  }
  $(".sback").onclick = () => shop.classList.add("hidden");
  $(".pback").onclick = () => prod.classList.add("hidden");
  $(".order").onclick = async () => {
    const need = prod.dataset.need, name = $(".oname").value.trim(), phone = $(".ophone").value.trim();
    if (need.includes("c") && !sel.color) return toast(prod, "Pick a color");
    if (need.includes("s") && !sel.size) return toast(prod, "Pick a size");
    if (!name || phone.replace(/\D/g, "").length < 6) return toast(prod, "Add your name and phone");
    let ok = false;
    try { ok = (await fetch("/api/order", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...sel, name, phone, note: $(".onote").value.trim() }) }).then(r => r.json())).ok; } catch (e) {}
    if (!ok) return toast(prod, "Could not send. Call us: +374 77 88 15 76");
    prod.classList.add("hidden"); shop.classList.add("hidden"); toast(talk, "Order sent. We'll call you."); pit.jump();
  };
  if (location.hash === "#shop") { $(".accept").click(); setTimeout(() => $(".shop").click(), 400); }

}));
